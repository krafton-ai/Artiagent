### model
model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
image_max_pixels: 262144
video_max_pixels: 16384
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: false
freeze_language_model: false
disable_shuffling: false
deepspeed: examples/deepspeed/ds_z3_config.json

### dataset
dataset: vqa_loc_exp
template: qwen2_vl
cutoff_len: 2048
# max_samples: 1000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
# output_dir: /opt/dlami/nvme/DMLAB/jhpark/image-artifacts/vlm/saves/qwen2_5vl-7b/full/sft_artifacts_vanilla
output_dir: /data2/jhpark/image-artifacts/vlm/saves/qwen2_5vl-7b/vqa_loc_exp
logging_steps: 100
plot_loss: true
overwrite_output_dir: true
report_to: tensorboard  # choices: [none, wandb, tensorboard, swanlab, mlflow]
save_strategy: "no"        
save_steps: 1000              
# save_total_limit: 1        
save_only_model: true   

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 1
learning_rate: 1.0e-5
# num_train_epochs: 3.0
max_steps: 2812
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

